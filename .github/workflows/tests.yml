name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Git Bash on Windows: the launchers are `sh` scripts, run there as Claude Code runs them.
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      # On failure, the summary lines also go out as an annotation, which the check run shows
      # without signing in.
      - run: |
          set -o pipefail
          python -m pytest tests -rfEs --tb=line 2>&1 | tee pytest.log || {
            status=$?
            msg=$(grep -E '^(FAILED|ERROR) |\.py:[0-9]+: ' pytest.log | head -60 \
                  | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=pytest::${msg}"
            exit $status
          }
        env:
          COLUMNS: "200"
